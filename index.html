    <script>
        // Tailwind script
        function initTailwind() {
            // Already using CDN
        }
        
        // Members
        const members = [
            "션린위", "해인", "로아", "남해주", 
            "로은", "서도윤", "루이", "범지유"
        ]
        
        let currentPlatform = 0 // 0: twitter, 1: weverse, 2: instagram
        let currentTheme = 'dark'
        let posts = {
            twitter: [],
            weverse: [],
            instagram: []
        }
        let stories = []
        let selectedAdminImages = []
        let selectedAdminPlatform = 0
        
        // Fake initial data
        function seedInitialData() {
            // Twitter
            posts.twitter = [
                {
                    id: 1,
                    member: "션린위",
                    handle: "@seonrinwi",
                    time: "2시간",
                    content: "오늘 연습실에서 새로운 안무 짜보는 중인데 진짜 재밌어요 🔥",
                    images: ["https://picsum.photos/id/1015/800/600"],
                    likes: 2341,
                    retweets: 421
                },
                {
                    id: 2,
                    member: "로아",
                    handle: "@roa_clow",
                    time: "5시간",
                    content: "여러분 덕분에 오늘도 행복한 하루였습니다 💕",
                    images: ["https://picsum.photos/id/201/800/1000", "https://picsum.photos/id/202/800/1000"],
                    likes: 4120,
                    retweets: 892
                }
            ]
            
            // Weverse
            posts.weverse = [
                {
                    id: 101,
                    member: "해인",
                    time: "11시간 전",
                    content: "오늘 무대 끝나고 멤버들이랑 사진 많이 찍었어요~",
                    images: ["https://picsum.photos/id/301/900/600"],
                    likes: 1240,
                    isSecret: false
                }
            ]
            
            // Instagram
            posts.instagram = [
                {
                    id: 201,
                    member: "남해주",
                    images: ["https://picsum.photos/id/401/800/800"],
                    content: "새로운 계절과 함께 🌸",
                    likes: 8740
                }
            ]
            
            // Stories
            stories = [
                { member: "션린위", image: "https://picsum.photos/id/64/200/200" },
                { member: "로아", image: "https://picsum.photos/id/201/200/200" },
                { member: "해인", image: "https://picsum.photos/id/301/200/200" }
            ]
        }
        
        function renderMembers() {
            const containers = ['sidebar-members', 'right-members']
            
            containers.forEach(id => {
                const el = document.getElementById(id)
                if (!el) return
                el.innerHTML = ''
                
                members.forEach(member => {
                    const div = document.createElement('div')
                    div.className = `flex items-center gap-x-3 px-3 py-2 hover:bg-zinc-900 rounded-2xl cursor-pointer`
                    div.innerHTML = `
                        <div class="w-8 h-8 bg-zinc-700 rounded-2xl flex items-center justify-center text-xs font-bold">${member.substring(0,1)}</div>
                        <span>${member}</span>
                    `
                    el.appendChild(div)
                })
            })
        }
        
        function populateMemberSelects() {
            const selects = ['twitter-member-filter', 'weverse-member-filter', 'admin-member']
            
            selects.forEach(id => {
                const select = document.getElementById(id)
                if (!select) return
                
                // Clear
                select.innerHTML = `<option value="">전체</option>`
                
                members.forEach(m => {
                    const opt = document.createElement('option')
                    opt.value = m
                    opt.textContent = m
                    select.appendChild(opt)
                })
            })
        }
        
        function switchPlatform(n) {
            currentPlatform = n
            
            document.querySelectorAll('.platform-content').forEach(el => el.classList.add('hidden'))
            document.getElementById(`platform-${['twitter','weverse','instagram'][n]}`).classList.remove('hidden')
            
            // Update active tabs
            document.querySelectorAll('.tab-btn').forEach((el, i) => {
                if (i === n) el.classList.add('active', 'bg-zinc-900')
                else el.classList.remove('active', 'bg-zinc-900')
            })
            
            document.querySelectorAll('.mobile-nav-item').forEach((el, i) => {
                if (i === n) el.classList.add('active', 'text-blue-400')
                else el.classList.remove('active', 'text-blue-400')
            })
        }
        
        function renderTwitterFeed() {
            const container = document.getElementById('twitter-feed')
            container.innerHTML = ''
            
            posts.twitter.forEach(post => {
                const div = document.createElement('div')
                div.className = 'p-4 hover:bg-zinc-950 transition-colors border-b border-zinc-800'
                div.innerHTML = `
                    <div class="flex gap-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-pink-400 to-violet-500 rounded-full flex-shrink-0"></div>
                        <div class="flex-1">
                            <div class="flex items-center gap-x-2">
                                <span class="font-bold">${post.member}</span>
                                <span class="text-zinc-500">${post.handle}</span>
                                <span class="text-zinc-500">·</span>
                                <span class="text-zinc-500">${post.time}</span>
                            </div>
                            <div class="mt-1 text-[15px] leading-relaxed">${post.content}</div>
                            
                            ${post.images && post.images.length ? `
                            <div class="mt-3 rounded-3xl overflow-hidden border border-zinc-700 ${post.images.length > 1 ? 'grid gap-1' : ''}" 
                                 style="grid-template-columns: ${post.images.length === 3 ? 'repeat(2,1fr)' : '1fr'};">
                                ${post.images.map((img, i) => `
                                    <img onclick="openImageViewer([${post.images.map(url => `'${url}'`)}], ${i})" 
                                         src="${img}" 
                                         class="w-full cursor-pointer hover:brightness-90 transition-all ${post.images.length === 1 ? 'aspect-video object-cover' : 'aspect-square object-cover'}">
                                `).join('')}
                            </div>` : ''}
                            
                            <div class="flex justify-between mt-4 max-w-[280px] text-zinc-400">
                                <div onclick="likePost('twitter', ${post.id})" class="flex items-center gap-x-2 hover:text-blue-400 cursor-pointer">
                                    <i class="fa-regular fa-comment"></i>
                                </div>
                                <div onclick="retweetPost(${post.id})" class="flex items-center gap-x-2 hover:text-green-400 cursor-pointer">
                                    <i class="fa-solid fa-retweet"></i>
                                    <span class="text-xs">${post.retweets}</span>
                                </div>
                                <div onclick="likePost('twitter', ${post.id})" class="flex items-center gap-x-2 hover:text-red-400 cursor-pointer">
                                    <i class="fa-regular fa-heart"></i>
                                    <span class="text-xs">${post.likes}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `
                container.appendChild(div)
            })
        }
        
        function renderWeverseFeed() {
            const container = document.getElementById('weverse-feed')
            container.innerHTML = ''
            
            posts.weverse.forEach(post => {
                const card = document.createElement('div')
                card.className = 'bg-zinc-900 rounded-3xl overflow-hidden'
                card.innerHTML = `
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-x-3">
                            <div class="w-9 h-9 bg-rose-400 rounded-2xl"></div>
                            <div>
                                <div class="font-medium">${post.member}</div>
                                <div class="text-xs text-zinc-500">${post.time}</div>
                            </div>
                        </div>
                        ${post.isSecret ? `<i class="fa-solid fa-lock text-amber-400"></i>` : ''}
                    </div>
                    
                    ${post.images && post.images.length ? `
                    <div class="px-4 pb-3">
                        <img onclick="openImageViewer(['${post.images[0]}'])" src="${post.images[0]}" class="w-full rounded-3xl">
                    </div>` : ''}
                    
                    <div class="px-5 pb-5 text-[15px]">${post.content}</div>
                    
                    <div class="border-t border-zinc-800 px-5 py-4 flex items-center justify-between text-sm">
                        <button onclick="likePost('weverse', ${post.id}); this.classList.add('text-red-400')" 
                                class="flex items-center gap-x-2">
                            <i class="fa-regular fa-heart"></i>
                            <span>${post.likes}</span>
                        </button>
                        <button class="text-blue-400 flex items-center gap-x-1">
                            <span>번역 보기</span>
                        </button>

        function openImageViewer(imageArray, startIndex = 0) {

            function showImage() {
                content.innerHTML = `
                    <img src="${imageArray[currentIndex]}" 
                         class="max-h-[80vh] max-w-full object-contain">
                `
                document.getElementById('viewer-counter').textContent = `${currentIndex + 1} / ${imageArray.length}`
            }
            
            // Add swipe support later if needed
            viewer.onclick = function(e) {
                if (e.target.id === 'image-viewer') closeImageViewer()
            }
            
            viewer.classList.remove('hidden')
            showImage()

                content: content,

                likes: Math.floor(300 + Math.random() * 3000),

        // File upload simulation
        function setupFileUpload() {
            const input = document.getElementById('admin-file-input')
            const label = document.getElementById('admin-upload-label')
            const previewContainer = document.getElementById('admin-image-preview')
            
            label.addEventListener('click', () => input.click())
            
            input.addEventListener('change', function() {
                previewContainer.innerHTML = ''
                selectedAdminImages = []
                
                Array.from(this.files).slice(0, 10).forEach(file => {
                    const reader = new FileReader()
                    reader.onload = function(e) {
                        selectedAdminImages.push(e.target.result)
                        
                        const imgDiv = document.createElement('div')
                        imgDiv.className = 'aspect-square rounded-2xl overflow-hidden border border-zinc-700'
                        imgDiv.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`
                        previewContainer.appendChild(imgDiv)
                    }
                    reader.readAsDataURL(file)
                })
            })
        }

        }
