<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Pretendard',sans-serif;
      background:#0a0a0a;
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .bg{
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at top left,#3b1d74 0%,transparent 35%),
      radial-gradient(circle at bottom right,#0ea5e9 0%,transparent 30%),
      #0a0a0a;
      filter:blur(20px);
      opacity:.9;
    }

    .card{
      position:relative;
      width:min(92vw,420px);
      padding:38px 26px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:30px;
      backdrop-filter:blur(18px);
      background:rgba(255,255,255,.05);
      box-shadow:0 10px 40px rgba(0,0,0,.45);
      text-align:center;
      z-index:1;
    }

    .profile{
      width:92px;
      height:92px;
      border-radius:50%;
      margin:0 auto 18px;
      background:linear-gradient(135deg,#ffffff,#777);
    }

    h1{
      font-size:32px;
      font-weight:700;
      letter-spacing:-1px;
      margin-bottom:8px;
    }

    p{
      color:rgba(255,255,255,.65);
      font-size:14px;
      line-height:1.6;
      margin-bottom:28px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .btn{
      height:54px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.06);
      color:white;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:600;
      transition:.2s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.12);
    }

    .footer{
      margin-top:24px;
      font-size:12px;
      color:rgba(255,255,255,.35);
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <div class="profile"></div>

    <h1>SNS</h1>
    <p>
      simple social archive<br>
      minimal ui concept
    </p>

    <div class="links">
      <a href="#" class="btn">Instagram</a>
      <a href="#" class="btn">Twitter</a>
      <a href="#" class="btn">YouTube</a>
      <a href="#" class="btn">TikTok</a>
    </div>

    <div class="footer">
      made by cnstkal
    </div>
  </div>
</body>
</html>
