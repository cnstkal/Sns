<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="meta-theme-color" content="#000000">
<title>CLOW Archive</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ============================================================
   CSS VARIABLES
   ============================================================ */
:root {
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --tr: 0.2s ease;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --nav-h: 56px; /* bottom nav height */
  --top-h: 52px; /* top platform bar (mobile hidden) */
}

/* ---- LIGHT ---- */
[data-theme="light"] {
  --bg: #fafafa;
  --bg2: #f2f2f2;
  --bg3: #e8e8e8;
  --border: #dbdbdb;
  --text: #111111;
  --text2: #737373;
  --text3: #a8a8a8;
  --card: #ffffff;
  --hover: #f5f5f5;
  --tw-accent: #1d9bf0;
  --wv-accent: #9b59b6;
  --shadow: rgba(0,0,0,0.08);
}

/* ---- DARK ---- */
[data-theme="dark"] {
  --bg: #000000;
  --bg2: #121212;
  --bg3: #1e1e1e;
  --border: #262626;
  --text: #f1f1f1;
  --text2: #8e8e8e;
  --text3: #555555;
  --card: #111111;
  --hover: #0a0a0a;
  --tw-accent: #1d9bf0;
  --wv-accent: #b37fd4;
  --shadow: rgba(255,255,255,0.04);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100%;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y;
  transition: background 0.25s, color 0.25s;
}

button { font-family: var(--font); cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
input, textarea, select { font-family: var(--font); -webkit-appearance: none; }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; -ms-overflow-style: none; }

/* ============================================================
   LAYOUT — MOBILE-FIRST
   ============================================================ */
/* On mobile: top platform-bar hidden, use bottom nav */
/* On desktop: top platform-bar visible, bottom nav hidden */

#platform-tabs-desktop {
  display: none; /* hidden on mobile */
}

/* ---- BOTTOM NAV (mobile) ---- */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 2000;
  height: calc(var(--nav-h) + var(--safe-bottom));
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  padding-top: 6px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.bn-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 0;
  color: var(--text3);
  font-size: 10px;
  font-weight: 500;
  transition: color 0.2s;
  cursor: pointer;
}
.bn-item.active { color: var(--text); }
.bn-item svg { width: 24px; height: 24px; }

.bn-icon-wrap {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

/* Twitter bottom tab indicator */
#bn-twitter.active .bn-icon-wrap::after { content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background: var(--tw-accent); }

/* ---- TOP HEADER (each platform has its own, mobile version) ---- */
.mobile-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  height: calc(var(--top-h) + var(--safe-top));
  padding-top: var(--safe-top);
  display: flex;
  align-items: center;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* ---- MAIN CONTENT ---- */
#app {
  padding-top: calc(var(--top-h) + var(--safe-top));
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom));
  min-height: 100dvh;
}

.platform-view { display: none; }
.platform-view.active { display: block; }

/* ============================================================
   TWITTER — X-style dark/cold/dense
   ============================================================ */

/* Twitter header */
#tw-mobile-header {
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  justify-content: space-between;
  gap: 12px;
}
[data-theme="light"] #tw-mobile-header {
  background: rgba(255,255,255,0.9);
}

.tw-header-logo {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -1px;
  color: var(--tw-accent);
  flex-shrink: 0;
}

.tw-header-search {
  flex: 1;
  position: relative;
}
.tw-header-search input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid transparent;
  border-radius: 20px;
  padding: 7px 14px 7px 32px;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: all 0.2s;
}
.tw-header-search input:focus { border-color: var(--tw-accent); background: var(--bg2); }
.tw-header-search .si {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text3); font-size: 13px; pointer-events: none;
}

.tw-theme-btn {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; color: var(--text2);
  transition: background 0.2s;
}
.tw-theme-btn:hover, .tw-theme-btn:active { background: var(--bg3); }

/* Twitter member filter */
#tw-view {
  max-width: 600px;
  margin: 0 auto;
}

.tw-member-strip {
  display: flex;
  gap: 8px;
  padding: 10px 14px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.tw-chip {
  flex-shrink: 0;
  padding: 5px 13px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  color: var(--text2);
  background: var(--bg);
  transition: all 0.15s;
  white-space: nowrap;
}
.tw-chip.active { background: var(--tw-accent); border-color: var(--tw-accent); color: #fff; font-weight: 600; }

/* Tweet card */
.tweet-card {
  display: flex;
  gap: 11px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
  transition: background 0.12s;
  cursor: pointer;
}
.tweet-card:active { background: var(--hover); }

.tw-av {
  width: 40px; height: 40px;
  border-radius: 50%; overflow: hidden; flex-shrink: 0;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: var(--text2);
}
.tw-av img { width: 100%; height: 100%; object-fit: cover; }

.tw-body { flex: 1; min-width: 0; }

.tw-meta {
  display: flex; align-items: baseline; flex-wrap: wrap;
  gap: 3px 5px; margin-bottom: 2px;
}
.tw-name { font-size: 15px; font-weight: 700; color: var(--text); }
.tw-handle { font-size: 13px; color: var(--text2); }
.tw-dot { font-size: 13px; color: var(--text3); }
.tw-time { font-size: 13px; color: var(--text2); }
.tw-era {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg3);
  color: var(--text2);
  padding: 2px 7px;
  border-radius: 10px;
}

.tw-text {
  font-size: 15px; line-height: 1.5; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
  margin-bottom: 8px;
}

/* Tweet images */
.tw-imgs { border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
.tw-img-1 img { width: 100%; max-height: 320px; object-fit: cover; cursor: pointer; }
.tw-img-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.tw-img-2 img { height: 180px; object-fit: cover; width: 100%; cursor: pointer; }
.tw-img-3 { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
.tw-img-3 img:first-child { grid-row: 1/3; height: 250px; object-fit: cover; cursor: pointer; }
.tw-img-3 img { height: 125px; object-fit: cover; cursor: pointer; }
.tw-img-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.tw-img-4 img { height: 130px; object-fit: cover; cursor: pointer; }

/* Tweet actions */
.tw-actions {
  display: flex; gap: 16px; align-items: center;
}
.tw-act-btn {
  display: flex; align-items: center; gap: 4px;
  color: var(--text3); font-size: 13px;
  padding: 4px 0; transition: color 0.15s;
}
.tw-act-btn svg { width: 17px; height: 17px; }
.tw-act-btn:active, .tw-act-btn:hover { color: var(--tw-accent); }
.tw-act-btn.liked { color: #f91880; }

/* more btn */
.post-more-btn {
  position: absolute; top: 12px; right: 14px;
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: 18px; font-weight: 700;
  transition: all 0.15s;
  letter-spacing: -1px;
}
.post-more-btn:active { background: var(--bg3); color: var(--text); }

/* ============================================================
   WEVERSE — warm, rounded, community
   ============================================================ */

#wv-mobile-header {
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  justify-content: space-between;
  gap: 12px;
  background: var(--bg);
}

.wv-header-logo {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #b37fd4, #7eb8f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  flex-shrink: 0;
}

.wv-header-search {
  flex: 1; position: relative;
}
.wv-header-search input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 7px 14px 7px 32px;
  font-size: 14px; color: var(--text); outline: none;
  transition: all 0.2s;
}
.wv-header-search input:focus { border-color: var(--wv-accent); }
.wv-header-search .si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; }

/* Weverse member tabs */
.wv-member-tabs {
  display: flex; overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.wv-m-tab {
  flex-shrink: 0;
  padding: 11px 16px;
  font-size: 14px; font-weight: 600;
  color: var(--text3);
  border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all 0.2s;
}
.wv-m-tab.active { color: var(--wv-accent); border-bottom-color: var(--wv-accent); }

/* Weverse feed */
#wv-view {
  background: var(--bg2);
  min-height: 100%;
}
.wv-feed { padding: 12px; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.wv-card {
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.wv-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 10px;
  position: relative;
}
.wv-av {
  width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--text2);
}
.wv-av img { width: 100%; height: 100%; object-fit: cover; }
.wv-meta { flex: 1; }
.wv-name { font-size: 15px; font-weight: 700; }
.wv-time { font-size: 12px; color: var(--text3); margin-top: 1px; }
.wv-era-tag {
  font-size: 10px;
  background: linear-gradient(135deg, rgba(179,127,212,0.15), rgba(126,184,247,0.15));
  color: var(--wv-accent);
  border: 1px solid rgba(179,127,212,0.25);
  padding: 3px 9px; border-radius: 12px;
}
.wv-secret-tag {
  font-size: 10px;
  background: rgba(241,196,15,0.12);
  color: #e6a817;
  border: 1px solid rgba(241,196,15,0.25);
  padding: 3px 9px; border-radius: 12px;
}

.wv-card-body { padding: 0 14px 12px; }
.wv-card-text {
  font-size: 15px; line-height: 1.7; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}

/* secret */
.wv-secret-wrap { position: relative; }
.wv-secret-blur { filter: blur(7px); user-select: none; pointer-events: none; }
.wv-secret-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; cursor: pointer;
}
.wv-unlock-btn {
  background: linear-gradient(135deg, #b37fd4, #7eb8f7);
  color: #fff;
  border-radius: 20px;
  padding: 8px 20px;
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}

/* Weverse images */
.wv-imgs { padding: 0 14px 12px; }
.wv-img-1 img { width: 100%; border-radius: 14px; max-height: 380px; object-fit: cover; cursor: pointer; }
.wv-img-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.wv-img-2 img { height: 160px; object-fit: cover; border-radius: 10px; cursor: pointer; }
.wv-img-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
.wv-img-3 img { height: 110px; object-fit: cover; border-radius: 10px; cursor: pointer; }
.wv-img-n { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
.wv-img-n img { height: 110px; object-fit: cover; border-radius: 10px; cursor: pointer; }
.wv-img-more-wrap { position: relative; }
.wv-img-more-label {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.55);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px; font-weight: 700; cursor: pointer;
}

/* Weverse footer */
.wv-card-foot {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.wv-actions { display: flex; align-items: center; gap: 14px; }
.wv-act-btn {
  display: flex; align-items: center; gap: 5px;
  color: var(--text2); font-size: 13px;
  transition: color 0.15s;
}
.wv-act-btn svg { width: 19px; height: 19px; }
.wv-act-btn:active, .wv-act-btn:hover { color: var(--wv-accent); }
.wv-act-btn.liked { color: #e74c3c; }
.wv-translate-btn {
  font-size: 12px; color: var(--wv-accent);
  padding: 5px 12px;
  border: 1px solid rgba(179,127,212,0.35);
  border-radius: 14px; align-self: flex-start;
  transition: background 0.2s;
}
.wv-translate-btn:active { background: rgba(179,127,212,0.1); }
.wv-translate-box {
  display: none;
  font-size: 13px; line-height: 1.6;
  color: var(--text2);
  padding: 10px 12px;
  background: var(--bg2);
  border-radius: 10px;
  border-left: 3px solid var(--wv-accent);
}
.wv-translate-box.show { display: block; }

/* ============================================================
   INSTAGRAM — pure image, white/minimal
   ============================================================ */

#ig-mobile-header {
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  justify-content: space-between;
  background: var(--bg);
}

.ig-header-logo {
  font-size: 22px; font-weight: 800;
  letter-spacing: -1.5px; font-style: italic;
  color: var(--text);
}

.ig-header-actions { display: flex; align-items: center; gap: 6px; }
.ig-header-btn {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); font-size: 20px; font-weight: 300;
  transition: background 0.15s;
}
.ig-header-btn:active { background: var(--bg3); }

/* Instagram search bar (below header, sticky) */
.ig-search-sticky {
  position: sticky;
  top: calc(var(--top-h) + var(--safe-top));
  z-index: 90;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
}
.ig-search-wrap {
  position: relative;
}
.ig-search-wrap input {
  width: 100%;
  background: var(--bg3);
  border: none; border-radius: 10px;
  padding: 8px 14px 8px 34px;
  font-size: 14px; color: var(--text); outline: none;
}
.ig-search-wrap .si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); }

/* Instagram stories */
.ig-stories-row {
  display: flex; gap: 14px;
  padding: 12px 14px;
  overflow-x: auto;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.ig-story-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px;
  flex-shrink: 0; cursor: pointer;
}
.ig-story-ring {
  width: 62px; height: 62px; border-radius: 50%;
  padding: 2.5px;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}
.ig-story-inner {
  width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background: var(--bg2);
  border: 2.5px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: var(--text2);
}
.ig-story-inner img { width: 100%; height: 100%; object-fit: cover; }
.ig-story-name { font-size: 11px; color: var(--text); max-width: 64px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Instagram member filter */
.ig-member-strip {
  display: flex; gap: 7px;
  padding: 9px 14px;
  overflow-x: auto;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

/* Instagram feed */
#ig-view { background: var(--bg); }
.ig-feed { max-width: 470px; margin: 0 auto; }

/* Post card */
.ig-card { border-bottom: 1px solid var(--border); }

.ig-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; position: relative;
}
.ig-card-av {
  width: 36px; height: 36px;
  border-radius: 50%; padding: 2px; flex-shrink: 0;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}
.ig-card-av-inner {
  width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background: var(--bg3);
  border: 2px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--text2);
}
.ig-card-av-inner img { width: 100%; height: 100%; object-fit: cover; }
.ig-card-name { font-size: 14px; font-weight: 600; }
.ig-card-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }

/* Carousel */
.ig-carousel {
  position: relative;
  background: #000;
  aspect-ratio: 1/1;
  overflow: hidden;
  /* container query context for slide sizing */
  container-type: size;
  container-name: carousel;
}
.ig-carousel-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  will-change: transform;
}
/* Each slide takes exactly the carousel container width */
.ig-carousel-slide {
  flex: 0 0 100%;   /* <- 핵심: 100cqw 대신 flex-basis 100% (트랙 기준 아닌 carousel 기준) */
  min-width: 0;
  height: 100%;
  overflow: hidden;
}
.ig-carousel-slide img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block; }

.ig-carousel-dots {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px;
}
.ig-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: all 0.2s; }
.ig-dot.active { background: white; width: 16px; border-radius: 3px; }

.ig-carr-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.88);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #111; z-index: 5;
  box-shadow: 0 1px 5px rgba(0,0,0,0.2);
}
.ig-carr-btn.prev { left: 8px; }
.ig-carr-btn.next { right: 8px; }
.ig-multi-icon {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,0.55); border-radius: 4px;
  padding: 3px 5px; color: #fff; font-size: 11px; z-index: 5;
}

/* Instagram actions */
.ig-actions {
  display: flex; align-items: center;
  padding: 9px 14px 4px;
  gap: 14px;
}
.ig-act-btn {
  display: flex; align-items: center;
  color: var(--text); transition: opacity 0.15s;
}
.ig-act-btn svg { width: 24px; height: 24px; }
.ig-act-btn:active { opacity: 0.6; }

<script type="module">
// ============================================================
// FIREBASE
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc,
  updateDoc, deleteDoc, query, orderBy, onSnapshot,
  setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const fbApp = initializeApp({
  apiKey: "AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs",
  authDomain: "site-c67b4.firebaseapp.com",
  projectId: "site-c67b4",
  storageBucket: "site-c67b4.firebasestorage.app",
  messagingSenderId: "744761377245",
  appId: "1:744761377245:web:3ddaee14f184716eeef634"
});
const db = getFirestore(fbApp);

// ============================================================
// CLOUDINARY
// ============================================================
const CLD_CLOUD = 'dbljkloal';
const CLD_PRESET = 'clowofficial';

async function uploadCld(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`, { method:'POST', body:fd });
  const d = await r.json();
  if (!d.secure_url) throw new Error('Cloudinary 업로드 실패');
  return d.secure_url;
}

// ============================================================
// CONSTANTS
// ============================================================
const MEMBERS = ['션린위','해인','로아','남해주','로은','서도윤','루이','범지유'];
const EMOJIS  = ['🌸','🌊','🌙','🍀','🌿','⭐','🌺','🦋'];

// ============================================================
// STATE
// ============================================================
let allPosts = [], allStories = [], profiles = {};
let platform = 'twitter';
let twSel = new Set(['all']), wvSel = new Set(['all']), igSel = new Set(['all']);
let postImgs = [], storyImgFile = null, storyMember = null;
let profImgFile = null, editingMember = null;
let isSecret = false;
let unlockedIds = new Set();
let pendingPwId = null;
let lbImgs = [], lbIdx = 0, lbTouchX = 0;
let svList = [], svIdx = 0, svTimer = null;
function formatTags(text=''){
  return text.replace(/(^|\s)#([A-Za-z0-9가-힣_]+)/g,(m,sp,tag)=>{
    if(/[😀-🙏🌀-🗿]/u.test(tag)) return m;
    return `${sp}<span class="hash-tag">#${tag}</span>`;
  });
}


// ============================================================
// BOOT
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  applyTheme(localStorage.getItem('clow-theme') || 'dark');
  buildFilters();
  buildAdminGrids();
  setNow();
  onPlatformChange();

  // Posts realtime
  onSnapshot(query(collection(db,'posts'), orderBy('timestamp','desc')), snap => {
    allPosts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderCurrent();
  });

  // Stories realtime
  onSnapshot(query(collection(db,'stories'), orderBy('timestamp','desc')), snap => {
    allStories = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderStories();
  });

  await loadProfiles();
  renderCurrent();
});

// ============================================================
// THEME
// ============================================================
function applyTheme(t) {
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('clow-theme', t);
  const ico = t === 'dark' ? '☀️' : '🌙';
  ['dt-theme-icon','tw-theme-icon','ig-theme-icon'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = ico;
  });
  // weverse theme button (no id, find by header)
  document.querySelectorAll('.tw-theme-btn').forEach(b => b.textContent = ico);
  document.getElementById('meta-theme-color').setAttribute('content', t === 'dark' ? '#000000' : '#ffffff');
}
window.toggleTheme = () => applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

// ============================================================
// PLATFORM SWITCH
// ============================================================
window.switchPlatform = function(p) {
  platform = p;
  // views
  document.querySelectorAll('.platform-view').forEach(v => v.classList.remove('active'));
  document.getElementById(`${p}-view`).classList.add('active');
  document.getElementById('admin-view').classList.remove('active');
  // desktop tabs
  document.querySelectorAll('.dt-tab').forEach((b,i) => b.classList.toggle('active', ['twitter','weverse','instagram'][i]===p));
  // bottom nav
  ['twitter','weverse','instagram'].forEach(k => {
    document.getElementById(`bn-${k}`)?.classList.toggle('active', k===p);
  });
  document.getElementById('bn-admin')?.classList.remove('active');
  renderCurrent();
};

function renderCurrent() {
  if (platform==='twitter') renderTwitter();
  else if (platform==='weverse') renderWeverse();
  else renderInstagram();
}

// ============================================================
// ADMIN
// ============================================================
window.openAdmin = function() {
  document.querySelectorAll('.platform-view').forEach(v => v.classList.remove('active'));
  document.getElementById('admin-view').classList.add('active');
  document.querySelectorAll('.dt-tab, .bn-item').forEach(b => b.classList.remove('active'));
  document.getElementById('bn-admin')?.classList.add('active');
};
window.closeAdmin = function() {
  document.getElementById('admin-view').classList.remove('active');
  switchPlatform(platform);
};
window.switchAdminTab = function(tab, btn) {
  document.querySelectorAll('.a-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.admin-pane').forEach(p => p.classList.remove('active'));
  document.getElementById(`pane-${tab}`).classList.add('active');
};

// ============================================================
// FILTERS
// ============================================================
function buildFilters() {
  MEMBERS.forEach(m => {
    // Twitter
    const t = mk('button','tw-chip'); t.dataset.m = m; t.textContent = m;
    t.onclick = () => twFilter(m, t);
    document.getElementById('tw-chips').appendChild(t);

    // Weverse
    const w = mk('button','wv-m-tab'); w.dataset.m = m; w.textContent = m;
    w.onclick = () => wvFilter(m, w);
    document.getElementById('wv-tabs').appendChild(w);

    // Instagram
    const i = mk('button','tw-chip'); i.dataset.m = m; i.textContent = m;
    i.onclick = () => igFilter(m, i);
    document.getElementById('ig-chips').appendChild(i);
  });
}

function toggleFilter(set, member) {
  if (member==='all') { set.clear(); set.add('all'); }
  else {
    set.delete('all');
    if (set.has(member)) set.delete(member);
    else set.add(member);
    if (set.size===0) set.add('all');
  }
}

window.twFilter = function(m, btn) {
  toggleFilter(twSel, m);
  syncChips('#tw-chips .tw-chip', twSel);
  renderTwitter();
};
window.wvFilter = function(m, btn) {
  toggleFilter(wvSel, m);
  syncChips('#wv-tabs .wv-m-tab', wvSel);
  renderWeverse();
};
window.igFilter = function(m, btn) {
  toggleFilter(igSel, m);
  syncChips('#ig-chips .tw-chip', igSel);
  renderInstagram();
};

function syncChips(sel, set) {
  document.querySelectorAll(sel).forEach(b => {
    const m = b.dataset.m;
    b.classList.toggle('active', set.has(m) || (set.has('all') && m==='all'));
  });
}

// ============================================================
// SEARCH + FILTER POSTS
// ============================================================
function filtered(plat) {
  const sel = plat==='twitter' ? twSel : plat==='weverse' ? wvSel : igSel;
  const q = (document.getElementById(plat==='twitter'?'tw-search':plat==='weverse'?'wv-search':'ig-search')?.value||'').toLowerCase().trim();

  return allPosts.filter(p => {
    if (p.platform !== plat) return false;
    if (!sel.has('all') && !sel.has(p.member) && !(p.members||[]).some(m=>sel.has(m))) return false;
    if (q) {
      const ts = [p.member,...(p.members||[]),p.content||'',p.era||'', fmtDate(getDate(p.timestamp))].join(' ').toLowerCase();
      if (!ts.includes(q)) return false;
    }
    return true;
  });
}

// ============================================================
// PROFILES
// ============================================================
async function loadProfiles() {
  for (const m of MEMBERS) {
    try {
      const s = await getDoc(doc(db,'profiles',m));
      const data = s.exists() ? s.data() : defaultProfile(m);
      profiles[m] = (!data.twitter && (data.name || data.photo || data.handle))
        ? { twitter:data, weverse:{...data}, instagram:{...data} }
        : data;
    } catch { profiles[m] = defaultProfile(m); }
  }
  buildProfCards();
}
function baseProfile(m){ return { name:m, handle:'@'+m.toLowerCase().replace(/\s/g,''), bio:'', photo:'' }; }

function defaultProfile(m) {
  return {
    twitter: baseProfile(m),
    weverse: baseProfile(m),
    instagram: baseProfile(m)
  };
}

function getProfile(m, plat=platform) {
  const p = profiles[m] || defaultProfile(m);

  if (!p.twitter && (p.name || p.photo || p.handle)) {
    return {
      name: p.name || m,
      handle: p.handle || '@'+m.toLowerCase().replace(/\s/g,''),
      bio: p.bio || '',
      photo: p.photo || ''
    };
  }

  const target = p[plat] || p.twitter || baseProfile(m);

  return {
    name: target.name || m,
    handle: target.handle || '@'+m.toLowerCase().replace(/\s/g,''),
    bio: target.bio || '',
    photo: target.photo || ''
  };
}

function buildProfCards() {
  const el = document.getElementById('prof-cards');
  el.innerHTML = '';
  MEMBERS.forEach((m,i) => {
    const p = getProfile(m, 'instagram');
    const card = mk('div','prof-card');
    card.innerHTML = `
      <div class="prof-card-av" id="pav-${i}">${p.photo?`<img src="${p.photo}" alt="">`:(EMOJIS[i]||'👤')}</div>
      <div class="prof-card-name">${m}</div>
      <div class="prof-card-handle" id="phandle-${i}">${p.handle||''}</div>
    `;
    card.onclick = () => openEdit(m);
    el.appendChild(card);
  });
}

function buildAdminGrids() {
  ['a-member-grid','a-story-grid'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = '';
    MEMBERS.forEach(m => {
      const c = mk('div','m-chip'); c.textContent = m; c.dataset.m = m;
      c.onclick = () => {
        if (id==='a-story-grid') {
          el.querySelectorAll('.m-chip').forEach(x=>x.classList.remove('on'));
          c.classList.add('on'); storyMember = m;
        } else {
          c.classList.toggle('on');
        }
      };
      el.appendChild(c);
    });
  });
}

// ============================================================
// PROFILE EDIT
// ============================================================
window.openEdit = function(m) {
  editingMember = m;
  profImgFile = null;

  const plat = document.getElementById('edit-platform').value;
  const p = getProfile(m, plat);

  document.getElementById('edit-title').textContent = `${m} · ${plat}`;
  document.getElementById('edit-name').value = p.name || '';
  document.getElementById('edit-handle').value = p.handle || '';
  document.getElementById('edit-bio').value = p.bio || '';

  const prev = document.getElementById('prof-img-preview');

  if (p.photo) {
    prev.innerHTML = `<img src="${p.photo}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto;">`;
  } else {
    prev.innerHTML = `<div style="font-size:28px;">👤</div><div style="font-size:13px;color:var(--text2);margin-top:4px;">이미지 선택</div>`;
  }

  document.getElementById('edit-overlay').classList.add('open');
};
window.editClose = () => document.getElementById('edit-overlay').classList.remove('open');

window.handleProfImg = function(e) {
  profImgFile = e.target.files[0];
  if (!profImgFile) return;
  const r = new FileReader();
  r.onload = ev => {
    document.getElementById('prof-img-preview').innerHTML =
      `<img src="${ev.target.result}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto;">`;
  };
  r.readAsDataURL(profImgFile);
};

window.editSave = async function() {
  if (!editingMember) return;

  toast('저장 중...');

  const plat = document.getElementById('edit-platform').value;
  const current = profiles[editingMember] || defaultProfile(editingMember);

  let photo = getProfile(editingMember, plat)?.photo || '';
  if (profImgFile) photo = await uploadCld(profImgFile);

  current[plat] = {
    name: document.getElementById('edit-name').value,
    handle: document.getElementById('edit-handle').value,
    bio: document.getElementById('edit-bio').value,
    photo
  };

  try {
    await setDoc(doc(db,'profiles',editingMember), current);
    profiles[editingMember] = current;
    buildProfCards();
    renderCurrent();
    editClose();
    toast('✅ 프로필 저장 완료');
  } catch(e) { toast('❌ 저장 실패: '+e.message); }
};

// ============================================================
// ADMIN: POST
// ============================================================
window.onPlatformChange = function() {
  const plat = document.getElementById('a-platform').value;
  document.getElementById('a-secret-row').style.display = plat==='weverse' ? 'block' : 'none';
  const hints = { twitter:'최대 4장', weverse:'제한 없음, 선택 사항', instagram:'최대 10장, 필수' };
  document.getElementById('a-img-hint').textContent = `(${hints[plat]})`;
  document.getElementById('a-img-sub').textContent = hints[plat];
  postImgs = []; renderImgPrev();
};

window.toggleSecret = function() {
  isSecret = !isSecret;
  document.getElementById('a-secret-tog').classList.toggle('on', isSecret);
  document.getElementById('a-pw-row').style.display = isSecret ? 'block' : 'none';
};

window.handleImgs = function(e) {
  const plat = document.getElementById('a-platform').value;
  const max = plat==='twitter'?4:plat==='instagram'?10:999;
  Array.from(e.target.files).forEach(file => {
    if (postImgs.length >= max) return;
    const r = new FileReader();
    r.onload = ev => { postImgs.push({file, prev:ev.target.result}); renderImgPrev(); };
    r.readAsDataURL(file);
  });
  e.target.value='';
};

function renderImgPrev() {
  const el = document.getElementById('a-img-previews');
  el.innerHTML = postImgs.map((img,i) => `
    <div class="img-prev">
      <img src="${img.prev}">
      <div class="img-prev-x" onclick="rmImg(${i})">✕</div>
    </div>
  `).join('');
}
window.rmImg = function(i) { postImgs.splice(i,1); renderImgPrev(); };

function setNow() {
  const now = new Date();
  document.getElementById('a-date').value = new Date(now - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
}

window.submitPost = async function() {
  const plat = document.getElementById('a-platform').value;
  const members = [...document.querySelectorAll('#a-member-grid .m-chip.on')].map(c=>c.dataset.m);
  if (!members.length) return toast('❌ 멤버를 선택해주세요');
  if (plat==='instagram' && postImgs.length===0) return toast('❌ 인스타는 이미지 필수');

  const btn = document.getElementById('a-submit');
  btn.disabled = true; btn.textContent = '업로드 중...';

  try {
    const urls = [];
    for (const img of postImgs) urls.push(await uploadCld(img.file));

    const likes = plat==='twitter'
      ? Math.floor(Math.random()*4200)+800
      : Math.floor(Math.random()*2700)+300;
    const rt = plat==='twitter' ? Math.floor(likes*(0.1+Math.random()*0.28)) : 0;

    await addDoc(collection(db,'posts'), {
      platform: plat,
      member: members[0],
      members,
      era: document.getElementById('a-era').value.trim(),
      content: document.getElementById('a-content').value.trim(),
      images: urls,
      timestamp: new Date(document.getElementById('a-date').value||Date.now()),
      likes, retweets: rt,
      isSecret: plat==='weverse' && isSecret,
      secretPassword: (plat==='weverse' && isSecret) ? document.getElementById('a-pw').value : '',
    });

    // reset
    document.getElementById('a-content').value='';
    document.getElementById('a-era').value='';
    document.getElementById('a-pw').value='';
    postImgs=[]; renderImgPrev();
    document.querySelectorAll('#a-member-grid .m-chip').forEach(c=>c.classList.remove('on'));
    isSecret=false;
    document.getElementById('a-secret-tog').classList.remove('on');
    document.getElementById('a-pw-row').style.display='none';
    setNow();
    toast('✅ 게시글 업로드 완료');

// ============================================================
// CAROUSEL (Instagram)
// ============================================================
function initCarousels() {
  document.querySelectorAll('.ig-carousel').forEach(c => {
    let sx=0;
    c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
    c.addEventListener('touchend',e=>{
      const dx=sx-e.changedTouches[0].clientX;
      if(Math.abs(dx)>40) dx>0?igNext(c.querySelector('.ig-carr-btn.next')):igPrev(c.querySelector('.ig-carr-btn.prev'));
    },{passive:true});
  });
}

window.igNext = function(btn) {
  if(!btn) return;
  const c=btn.closest('.ig-carousel');
  const track=c.querySelector('.ig-carousel-track');
  const slides=c.querySelectorAll('.ig-carousel-slide');
  const idx=Math.min(parseInt(c.dataset.idx||0)+1,slides.length-1);
  c.dataset.idx=idx;
  track.style.transform=`translateX(-${idx*c.clientWidth}px)`;
  c.querySelectorAll('.ig-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
};
window.igPrev = function(btn) {
  if(!btn) return;
  const c=btn.closest('.ig-carousel');
  const track=c.querySelector('.ig-carousel-track');
  const slides=c.querySelectorAll('.ig-carousel-slide');
  const idx=Math.max(parseInt(c.dataset.idx||0)-1,0);
  c.dataset.idx=idx;
  track.style.transform=`translateX(-${idx*c.clientWidth}px)`;
  c.querySelectorAll('.ig-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
};

window.openLb = function(imgs, start) {
  if(!imgs||!imgs.length) return;
  lbImgs=imgs; lbIdx=start||0;
  const track=document.getElementById('lb-track');
  track.innerHTML=imgs.map(u=>`<div class="lb-slide"><img src="${u}" loading="lazy"></div>`).join('');
  track.style.width=`${imgs.length*100}vw`;
  lbUpdate();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';

  const lb=document.getElementById('lightbox');
  lb._ts=e=>{lbTouchX=e.touches[0].clientX;};
  lb._te=e=>{const d=lbTouchX-e.changedTouches[0].clientX; if(Math.abs(d)>45) lbMove(d>0?1:-1);};
  lb.addEventListener('touchstart',lb._ts,{passive:true});
  lb.addEventListener('touchend',lb._te,{passive:true});
};

function lbUpdate() {
  document.getElementById('lb-track').style.transform=`translateX(-${lbIdx*100}vw)`;
  document.getElementById('lb-cnt').textContent=lbImgs.length>1?`${lbIdx+1} / ${lbImgs.length}`:'';
  document.getElementById('lb-prev').style.display=lbImgs.length>1&&lbIdx>0?'flex':'none';
  document.getElementById('lb-next').style.display=lbImgs.length>1&&lbIdx<lbImgs.length-1?'flex':'none';
}

window.lbMove = function(d) { lbIdx=Math.max(0,Math.min(lbImgs.length-1,lbIdx+d)); lbUpdate(); };
window.closeLb = function() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
  const lb=document.getElementById('lightbox');
  if(lb._ts) lb.removeEventListener('touchstart',lb._ts);
  if(lb._te) lb.removeEventListener('touchend',lb._te);
};
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLb();});

// ============================================================
// HELPERS
// ============================================================
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}

function avatar(member,size,extraCls='tw-av',plat=platform) {
  const p = getProfile(member, plat);
  const i=MEMBERS.indexOf(member);
  const emoji=EMOJIS[i]||'👤';

  if(p?.photo) {
    return `<div class="${extraCls}" style="width:${size}px;height:${size}px;"><img src="${p.photo}" alt="${member}"></div>`;
  }

  return `<div class="${extraCls}" style="width:${size}px;height:${size}px;font-size:${size*.4}px;">${emoji}</div>`;
}

function getDate(ts) {
  if(!ts) return new Date();
  if(ts.toDate) return ts.toDate();
  if(ts instanceof Date) return ts;
  return new Date(ts);
}

function fmtDate(d) {
  const s=(Date.now()-d)/1000;
  if(s<60) return '방금';
  if(s<3600) return `${Math.floor(s/60)}분 전`;
  if(s<86400) return `${Math.floor(s/3600)}시간 전`;
  if(s<604800) return `${Math.floor(s/86400)}일 전`;
  return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',year:'numeric'});
}

function fmtDateShort(d) {
  return d.toLocaleDateString('ko-KR',{month:'short',day:'numeric'});
}

function fmtN(n) {
  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'K';
  return String(n);
}

function xss(t) {
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

function esc(arr) {
  return JSON.stringify(arr).replace(/"/g,'&quot;');
