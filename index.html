<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLÖW Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Pretendard', system-ui, sans-serif; }
        .no-double-tap { touch-action: manipulation; }
        
        .platform-content { display: none; }
        .platform-content.active { display: block; }
        
        .light { 
            --bg: #f8f9fa; 
            --text: #1f2937; 
            --card: #ffffff; 
            --border: #e5e7eb;
        }
        .light body { background-color: var(--bg); color: var(--text); }
        .light .bg-zinc-900 { background-color: var(--card) !important; }
        .light .border-zinc-800 { border-color: var(--border) !important; }
    </style>
</head>
<body class="bg-zinc-950 text-white no-double-tap overflow-x-hidden min-h-screen">
    <div class="max-w-[1280px] mx-auto">

        <!-- Top Navigation -->
        <nav class="fixed top-0 left-0 right-0 z-50 bg-black border-b border-zinc-800 light:bg-white light:border-zinc-200">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-x-6">
                    <span class="text-2xl font-black tracking-tighter text-white light:text-black">CLÖW</span>
                    
                    <div class="hidden sm:flex gap-x-6 text-sm font-medium">
                        <div onclick="switchPlatform(0)" class="tab-btn cursor-pointer flex items-center gap-x-2 px-5 py-2 rounded-3xl" id="tab-0">
                            <i class="fa-brands fa-x-twitter"></i><span>트위터</span>
                        </div>
                        <div onclick="switchPlatform(1)" class="tab-btn cursor-pointer flex items-center gap-x-2 px-5 py-2 rounded-3xl" id="tab-1">
                            <i class="fa-solid fa-users"></i><span>위버스</span>
                        </div>
                        <div onclick="switchPlatform(2)" class="tab-btn cursor-pointer flex items-center gap-x-2 px-5 py-2 rounded-3xl" id="tab-2">
                            <i class="fa-brands fa-instagram"></i><span>인스타그램</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-x-3">
                    <button onclick="toggleSearch()" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-zinc-900 light:hover:bg-zinc-100">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <button onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-zinc-900 light:hover:bg-zinc-100">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="showAdminModal()" 
                            class="bg-white text-black px-5 py-2 rounded-3xl font-semibold flex items-center gap-x-2 hover:bg-zinc-200">
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden sm:inline">업로드</span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="h-14"></div>

        <!-- Main Content -->
        <div class="flex">
            <!-- Main Feed -->
            <div class="flex-1">
                <!-- Twitter -->
                <div id="platform-0" class="platform-content active">
                    <div class="max-w-xl mx-auto border-r border-l border-zinc-800 light:border-zinc-200 min-h-screen">
                        <div class="sticky top-14 bg-black/90 light:bg-white/90 backdrop-blur-lg border-b border-zinc-800 light:border-zinc-200 z-40 p-4 flex justify-between items-center">
                            <h1 class="font-bold text-xl">홈</h1>
                            <select id="filter-twitter" onchange="filterPosts(0)" class="bg-zinc-900 light:bg-zinc-100 border border-zinc-700 light:border-zinc-300 rounded-3xl px-4 py-2 text-sm">
                                <option value="">전체 멤버</option>
                            </select>
                        </div>
                        <div id="feed-0"></div>
                    </div>
                </div>

                <!-- Weverse -->
                <div id="platform-1" class="platform-content">
                    <div class="max-w-2xl mx-auto p-4">
                        <div class="sticky top-14 bg-black/90 light:bg-white/90 backdrop-blur-lg border-b border-zinc-800 light:border-zinc-200 z-40 p-4">
                            <select id="filter-weverse" onchange="filterPosts(1)" class="w-full bg-zinc-900 light:bg-zinc-100 border border-zinc-700 light:border-zinc-300 rounded-3xl px-5 py-3">
                                <option value="">전체 멤버</option>
                            </select>
                        </div>
                        <div id="feed-1" class="space-y-6"></div>
                    </div>
                </div>

                <!-- Instagram -->
                <div id="platform-2" class="platform-content">
                    <div class="max-w-lg mx-auto">
                        <!-- Stories -->
                        <div class="border-b border-zinc-800 light:border-zinc-200 py-4 px-4 overflow-x-auto">
                            <div id="stories" class="flex gap-x-6"></div>
                        </div>
                        <div id="feed-2" class="space-y-8 py-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <div class="fixed bottom-0 left-0 right-0 bg-black border-t border-zinc-800 light:bg-white light:border-zinc-200 md:hidden z-50">
        <div class="flex justify-around py-3 text-2xl">
            <div onclick="switchPlatform(0)" class="nav-item active"><i class="fa-brands fa-x-twitter"></i></div>
            <div onclick="switchPlatform(1)" class="nav-item"><i class="fa-solid fa-users"></i></div>
            <div onclick="switchPlatform(2)" class="nav-item"><i class="fa-brands fa-instagram"></i></div>
            <div onclick="showAdminModal()" class="nav-item"><i class="fa-solid fa-plus"></i></div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center">
        <div class="bg-zinc-900 light:bg-white light:text-black rounded-3xl w-full max-w-lg mx-4 max-h-[90vh] overflow-auto">
            <div class="p-6">
                <div class="flex justify-between mb-6">
                    <h2 class="text-2xl font-bold">관리자</h2>
                    <button onclick="hideAdminModal()" class="text-3xl">×</button>
                </div>
                
                <div class="flex border-b border-zinc-700 light:border-zinc-200 mb-6">
                    <button onclick="switchAdminTab(0)" class="admin-tab active flex-1 py-3 text-center font-medium">게시물 업로드</button>
                    <button onclick="switchAdminTab(1)" class="admin-tab flex-1 py-3 text-center font-medium">멤버 관리</button>
                </div>

                <!-- Upload Tab -->
                <div id="admin-upload-tab">
                    <select id="admin-platform" class="w-full bg-zinc-800 light:bg-zinc-100 border border-zinc-700 light:border-zinc-300 rounded-3xl px-5 py-3 mb-4">
                        <option value="0">트위터</option>
                        <option value="1">위버스</option>
                        <option value="2">인스타그램</option>
                    </select>
                    
                    <select id="admin-member-select" class="w-full bg-zinc-800 light:bg-zinc-100 border border-zinc-700 light:border-zinc-300 rounded-3xl px-5 py-3 mb-4"></select>
                    
                    <textarea id="admin-content" rows="4" class="w-full bg-zinc-800 light:bg-zinc-100 border border-zinc-700 light:border-zinc-300 rounded-3xl px-5 py-4" placeholder="내용 입력..."></textarea>
                    
                    <input id="admin-file" type="file" multiple accept="image/*" class="hidden">
                    <button onclick="document.getElementById('admin-file').click()" 
                            class="w-full py-4 border border-dashed border-zinc-600 light:border-zinc-400 rounded-3xl text-sm mt-4">
                        📸 이미지 업로드 (최대 10장)
                    </button>
                    <div id="admin-preview" class="grid grid-cols-4 gap-3 mt-4"></div>

                    <button onclick="submitPost()" class="w-full mt-6 bg-white light:bg-black light:text-white text-black font-bold py-4 rounded-3xl">게시하기</button>
                </div>

                <!-- Member Management Tab -->
                <div id="admin-member-tab" class="hidden">
                    <div id="member-list" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPlatform = 0;
        let theme = localStorage.getItem('theme') || 'dark';
        let members = [
            {name: "션린위", id: "seonrinwi", avatar: "https://picsum.photos/id/64/128/128"},
            {name: "해인", id: "haein", avatar: "https://picsum.photos/id/65/128/128"},
            {name: "로아", id: "roa", avatar: "https://picsum.photos/id/201/128/128"},
            {name: "남해주", id: "namhaeju", avatar: "https://picsum.photos/id/202/128/128"},
            {name: "로은", id: "roeun", avatar: "https://picsum.photos/id/203/128/128"},
            {name: "서도윤", id: "seodoyun", avatar: "https://picsum.photos/id/204/128/128"},
            {name: "루이", id: "rui", avatar: "https://picsum.photos/id/205/128/128"},
            {name: "범지유", id: "beomjiyu", avatar: "https://picsum.photos/id/206/128/128"}
        ];

        let posts = { 0: [], 1: [], 2: [] };

        function setTheme() {
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.classList.remove('light');
                document.getElementById('theme-icon').classList.replace('fa-sun', 'fa-moon');
            }
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            setTheme();
        }

        function switchPlatform(n) {
            currentPlatform = n;
            document.querySelectorAll('.platform-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`platform-${n}`).classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach((el, i) => {
                el.classList.toggle('bg-zinc-900', i === n);
                el.classList.toggle('light:bg-zinc-100', i === n);
            });
        }

        function renderMemberSelects() {
            const selects = ['filter-twitter', 'filter-weverse', 'admin-member-select'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (!select) return;
                select.innerHTML = `<option value="">전체 멤버</option>`;
                members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.textContent = m.name;
                    select.appendChild(opt);
                });
            });
        }

        function renderMemberList() {
            const container = document.getElementById('member-list');
            container.innerHTML = '';
            members.forEach((member, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 bg-zinc-800 light:bg-zinc-100 p-4 rounded-3xl";
                div.innerHTML = `
                    <img src="${member.avatar}" class="w-14 h-14 rounded-2xl object-cover">
                    <div class="flex-1">
                        <input value="${member.name}" onchange="updateMemberName(${index}, this.value)" 
                               class="bg-transparent font-semibold focus:outline-none w-full">
                    </div>
                    <button onclick="changeAvatar(${index})" class="text-xs bg-zinc-700 light:bg-zinc-200 px-4 py-2 rounded-2xl">사진 변경</button>
                `;
                container.appendChild(div);
            });
        }

        function updateMemberName(index, newName) {
            members[index].name = newName;
        }

        function changeAvatar(index) {
            alert('실제 구현 시 Cloudinary 업로드 연동 가능합니다.');
            // Demo: random image
            members[index].avatar = `https://picsum.photos/id/${300 + index}/128/128`;
            renderMemberList();
        }

        function filterPosts(platform) {
            renderFeed(platform);
        }

        function renderFeed(platform) {
            const container = document.getElementById(`feed-${platform}`);
            container.innerHTML = '';
            const filterValue = document.getElementById(`filter-${platform === 0 ? 'twitter' : 'weverse'}`)?.value || '';

            const filtered = posts[platform].filter(p => !filterValue || p.member === filterValue);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-zinc-500">게시물이 없습니다.</div>`;
                return;
            }

            filtered.forEach((post, idx) => {
                const div = document.createElement('div');
                div.className = platform === 2 ? 'px-4' : 'p-4 border-b border-zinc-800 light:border-zinc-200';
                
                if (platform === 0) { // Twitter
                    div.innerHTML = `
                        <div class="flex gap-3">
                            <img src="${members.find(m=>m.name===post.member)?.avatar}" class="w-11 h-11 rounded-full">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold">${post.member}</span>
                                    <span class="text-zinc-500">@${post.member.toLowerCase()}</span>
                                </div>
                                <p class="mt-1">${post.content}</p>
                                ${post.images ? `<img src="${post.images[0]}" class="mt-3 rounded-3xl cursor-pointer" onclick="openImage('${post.images[0]}')">` : ''}
                                <div class="flex justify-between mt-4 text-zinc-500">
                                    <i class="fa-regular fa-heart cursor-pointer" onclick="like(this)"></i>
                                    <span class="text-xs">${post.likes}</span>
                                </div>
                                <div class="text-right text-xs text-zinc-500 mt-2">
                                    <button onclick="editPost(0, ${idx})" class="hover:text-blue-400">수정</button>
                                    <button onclick="deletePost(0, ${idx})" class="hover:text-red-400 ml-3">삭제</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (platform === 1) { // Weverse
                    div.innerHTML = `... (위버스 카드 형태) ...`; // 생략 (길이 조절)
                } else if (platform === 2) { // Instagram
                    div.innerHTML = `
                        <div class="mb-6">
                            <div class="flex items-center justify-between px-2 mb-3">
                                <div class="flex items-center gap-3">
                                    <img src="${members.find(m=>m.name===post.member)?.avatar}" class="w-9 h-9 rounded-full ring-2 ring-white">
                                    <span class="font-semibold">${post.member}</span>
                                </div>
                                <i class="fa-solid fa-ellipsis cursor-pointer" onclick="showPostMenu(2, ${idx}, this)"></i>
                            </div>
                            <img src="${post.images[0]}" class="w-full aspect-square object-cover rounded-2xl cursor-pointer" onclick="openImage('${post.images[0]}')">
                            <div class="flex items-center gap-6 mt-4 px-2">
                                <i class="fa-regular fa-heart text-3xl cursor-pointer" onclick="like(this)"></i>
                                <span class="font-medium">${post.likes}개</span>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(div);
            });
        }

        function showPostMenu(platform, index, el) {
            if (confirm('게시글을 삭제하시겠습니까?')) {
                deletePost(platform, index);
            }
        }

        function deletePost(platform, index) {
            if (confirm('정말 삭제하시겠습니까?')) {
                posts[platform].splice(index, 1);
                renderFeed(platform);
            }
        }

        function editPost(platform, index) {
            const newContent = prompt('수정할 내용을 입력하세요:', posts[platform][index].content);
            if (newContent) {
                posts[platform][index].content = newContent;
                renderFeed(platform);
            }
        }

        function like(el) {
            el.classList.toggle('fa-solid');
            el.classList.toggle('text-red-500');
        }

        function openImage(src) {
            const viewer = document.createElement('div');
            viewer.className = "fixed inset-0 bg-black/95 z-[200] flex items-center justify-center";
            viewer.innerHTML = `<img src="${src}" class="max-h-[90vh] max-w-full">`;
            viewer.onclick = () => viewer.remove();
            document.body.appendChild(viewer);
        }

        function showAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
            renderMemberList();
        }

        function hideAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function switchAdminTab(n) {
            document.getElementById('admin-upload-tab').classList.toggle('hidden', n !== 0);
            document.getElementById('admin-member-tab').classList.toggle('hidden', n !== 1);
        }

        function submitPost() {
            const platform = parseInt(document.getElementById('admin-platform').value);
            const member = document.getElementById('admin-member-select').value || members[0].name;
            const content = document.getElementById('admin-content').value;

            if (!content) return alert('내용을 입력해주세요.');

            posts[platform].unshift({
                member: member,
                content: content,
                images: ["https://picsum.photos/id/400/800/800"],
                likes: Math.floor(Math.random() * 4000) + 500,
                time: "방금"
            });

            hideAdminModal();
            renderFeed(platform);
            alert('게시물이 업로드되었습니다.');
        }

        function initialize() {
            setTheme();
            renderMemberSelects();
            
            // 초기 데이터
            posts[0] = [{member: "션린위", content: "오늘도 열심히 연습 중입니다 🔥", likes: 3420, images: ["https://picsum.photos/id/1015/800/600"]}];
            posts[2] = [{member: "로아", content: "새로운 시작", likes: 12400, images: ["https://picsum.photos/id/201/800/800"]}];

            renderFeed(0);
            renderFeed(2);
            switchPlatform(0);
        }

        window.onload = initialize;
    </script>
</body>
</html>
