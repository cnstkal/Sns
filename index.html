<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SNS Archive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
      overscroll-behavior: none;
      touch-action: pan-y;
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .25s ease, color .25s ease;
    }

    img {
      pointer-events: none;
    }

    body.light {
      --bg: #f5f6f8;
      --card: #ffffff;
      --soft: #f0f2f5;
      --border: #e2e4e8;
      --text: #111111;
      --sub: #6d6d6d;
    }

    body.dark {
      --bg: #000000;
      --card: #16181c;
      --soft: #1d1f23;
      --border: #27292e;
      --text: #f8f8f8;
      --sub: #8f949d;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    .hidden-scroll::-webkit-scrollbar {
      display: none;
    }

    .app-shell {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 300;
      backdrop-filter: blur(18px);
      background: rgba(0,0,0,.68);
      border-bottom: 1px solid var(--border);
    }

    body.light .topbar {
      background: rgba(255,255,255,.85);
    }

    .platform-tabs {
      display: flex;
      gap: 8px;
      padding: 14px;
      overflow-x: auto;
    }

    .platform-btn {
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      background: var(--card);
      white-space: nowrap;
      transition: .2s;
    }

    .platform-btn.active {
      background: white;
      color: black;
      font-weight: 700;
    }

    body.light .platform-btn.active {
      background: black;
      color: white;
    }

    .section {
      display: none;
      min-height: calc(100vh - 70px);
    }

    .section.active {
      display: block;
    }

    .member-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 14px 0;
    }

    .member-chip {
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--sub);
      font-size: 12px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .member-chip.active {
      background: white;
      color: black;
      font-weight: 700;
    }

    body.light .member-chip.active {
      background: black;
      color: white;
    }

    .search-wrap {
      padding: 14px;
    }

    .search-input {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--soft);
      padding: 0 16px;
      color: var(--text);
      outline: none;
    }

    .twitter-feed {
      background: #000;
    }

    .twitter-post {
      border-bottom: 1px solid #23252b;
      padding: 14px;
      display: flex;
      gap: 12px;
      transition: .2s;
    }

    .twitter-post:hover {
      background: rgba(255,255,255,.03);
    }

    .tw-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .tw-grid {
      margin-top: 12px;
      border-radius: 18px;
      overflow: hidden;
      display: grid;
      gap: 2px;
      background: #2f3336;
    }

    .tw-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }

    .tw-grid.grid-1 {
      grid-template-columns: 1fr;
      height: 360px;
    }

    .tw-grid.grid-2 {
      grid-template-columns: repeat(2,1fr);
      height: 280px;
    }

    .tw-grid.grid-3,
    .tw-grid.grid-4 {
      grid-template-columns: repeat(2,1fr);
      grid-template-rows: repeat(2,180px);
    }

    .tw-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      color: #71767b;
      font-size: 13px;
    }

    .weverse-wrap {
      padding: 14px;
      background: linear-gradient(to bottom,#121212,#000);
    }

    .weverse-card {
      background: #1a1a1c;
      border-radius: 26px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #25272d;
    }

    .weverse-gallery {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 4px;
      margin-top: 14px;
      border-radius: 18px;
      overflow: hidden;
    }

    .weverse-gallery img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      cursor: pointer;
    }

    .secret-overlay {
      margin-top: 16px;
      background: rgba(255,255,255,.04);
      border: 1px dashed rgba(255,255,255,.1);
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      filter: blur(3px);
    }

    .ig-top {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 20;
    }

    .stories {
      display: flex;
      overflow-x: auto;
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .story-item {
      min-width: 72px;
      text-align: center;
    }

    .story-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg,#ff0069,#ff7a00,#ffd600);
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--bg);
    }

    .ig-post {
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      background: var(--bg);
    }

    .ig-media {
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .ig-media img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      cursor: pointer;
    }

    .carousel-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      background: rgba(0,0,0,.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
    }

    .admin-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 20px;
      z-index: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      background: #101114;
      border-radius: 28px;
      padding: 22px;
      color: white;
    }

    .modal-box input,
    .modal-box textarea,
    .modal-box select {
      width: 100%;
      background: #1c1e22;
      border: 1px solid #2a2c30;
      border-radius: 14px;
      padding: 14px;
      color: white;
      margin-top: 10px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: none;
      margin-top: 16px;
      background: white;
      color: black;
      font-weight: 700;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.96);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      width: 100%;
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }

    .dots-btn {
      margin-left: auto;
      color: var(--sub);
      cursor: pointer;
      position: relative;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 24px;
      background: #17181c;
      border: 1px solid #2a2c30;
      border-radius: 14px;
      overflow: hidden;
      display: none;
      z-index: 20;
    }

    .menu button {
      width: 120px;
      height: 42px;
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .menu button:hover {
      background: rgba(255,255,255,.06);
    }

    @media (min-width: 900px) {
      .app-shell {
        max-width: 1100px;
        display: grid;
        grid-template-columns: 320px 1fr;
      }

      .sidebar {
        border-right: 1px solid var(--border);
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .main {
        min-height: 100vh;
      }

      .topbar {
        position: static;
      }
    }
  </style>
</head>
<body class="dark">

<div class="app-shell">

  <aside class="sidebar topbar">
    <div class="platform-tabs hidden-scroll">
      <button class="platform-btn active" data-platform="twitter">Twitter</button>
      <button class="platform-btn" data-platform="weverse">Weverse</button>
      <button class="platform-btn" data-platform="instagram">Instagram</button>
      <button class="platform-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="member-filter hidden-scroll" id="memberFilter"></div>

    <div class="search-wrap">
      <input id="searchInput" class="search-input" placeholder="멤버 / 해시태그 / era / 날짜 검색" />
    </div>
  </aside>

  <main class="main">

    <section id="twitter" class="section active twitter-feed"></section>

    <section id="weverse" class="section">
      <div class="weverse-wrap" id="weverseFeed"></div>
    </section>

    <section id="instagram" class="section">
      <div class="ig-top">
        <div class="flex items-center justify-between">
          <div class="text-[22px] font-bold">Instagram</div>
          <div class="flex gap-4 text-[20px]">
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-paper-plane"></i>
          </div>
        </div>
      </div>

      <div class="stories hidden-scroll" id="stories"></div>

      <div id="instagramFeed"></div>
    </section>

  </main>
</div>

<button class="admin-btn" id="adminOpen">
  <i class="fa-solid fa-plus"></i>
</button>

<div class="modal" id="adminModal">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-[24px] font-bold">관리자 업로드</h2>
      <button onclick="closeAdmin()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <select id="platformSelect">
      <option value="twitter">트위터</option>
      <option value="weverse">위버스</option>
      <option value="instagram">인스타그램</option>
    </select>

    <select id="memberSelect"></select>

    <input type="date" id="dateInput">

    <input type="text" id="eraInput" placeholder="era 태그">

    <textarea id="contentInput" rows="5" placeholder="내용 입력"></textarea>

    <input type="password" id="secretPassword" placeholder="비밀포스트 비밀번호 (위버스용)">

    <label class="flex items-center gap-2 mt-4 text-[14px]">
      <input type="checkbox" id="secretToggle">
      비밀포스트
    </label>

    <input type="file" id="imageInput" multiple accept="image/*">

    <button class="submit-btn" id="uploadBtn">업로드</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-arrow lightbox-prev"><i class="fa-solid fa-chevron-left"></i></div>
  <img id="lightboxImage">
  <div class="lightbox-arrow lightbox-next"><i class="fa-solid fa-chevron-right"></i></div>
</div>

<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  updateDoc,
  doc,
  orderBy,
  query
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* =========================
   CLOUDINARY CONFIG
========================= */

const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'clowofficial';

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: 'AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs',
  authDomain: 'site-c67b4.firebaseapp.com',
  projectId: 'site-c67b4',
  storageBucket: 'site-c67b4.firebasestorage.app',
  messagingSenderId: '744761377245',
  appId: '1:744761377245:web:3ddaee14f184716eeef634'
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MEMBERS = [
  '션린위',
  '해인',
  '로아',
  '남해주',
  '로은',
  '서도윤',
  '루이',
  '범지유'
];

let activePlatform = 'twitter';
let activeMembers = [];
let posts = [];
let stories = [];
let lightboxImages = [];
let lightboxIndex = 0;

/* =========================
   PREVENT DOUBLE TAP ZOOM
========================= */

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

/* =========================
   THEME
========================= */

const savedTheme = localStorage.getItem('theme') || 'dark';
document.body.className = savedTheme;

function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  document.body.className = next;
  localStorage.setItem('theme', next);
}

document.getElementById('themeToggle').onclick = toggleTheme;

/* =========================
   FILTERS
========================= */

const memberFilter = document.getElementById('memberFilter');
const memberSelect = document.getElementById('memberSelect');

MEMBERS.forEach(member => {

  const chip = document.createElement('button');
  chip.className = 'member-chip';
  chip.innerText = member;

  chip.onclick = () => {
    chip.classList.toggle('active');

    if (activeMembers.includes(member)) {
      activeMembers = activeMembers.filter(v => v !== member);
    } else {
      activeMembers.push(member);
    }

    renderAll();
  };

  memberFilter.appendChild(chip);

  const option = document.createElement('option');
  option.value = member;
  option.innerText = member;
  memberSelect.appendChild(option);
});

/* =========================
   PLATFORM SWITCH
========================= */

const platformButtons = document.querySelectorAll('.platform-btn[data-platform]');

platformButtons.forEach(btn => {
  btn.onclick = () => {

    platformButtons.forEach(v => v.classList.remove('active'));
    btn.classList.add('active');

    activePlatform = btn.dataset.platform;

    document.querySelectorAll('.section').forEach(sec => {
      sec.classList.remove('active');
    });

    document.getElementById(activePlatform).classList.add('active');
  };
});

/* =========================
   SEARCH
========================= */

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', renderAll);

function filteredPosts(platform) {

  const q = searchInput.value.toLowerCase();

  return posts.filter(post => {

    if (post.platform !== platform) return false;

    if (activeMembers.length > 0 && !activeMembers.includes(post.member)) {
      return false;
    }

    const searchText = `${post.member} ${post.content} ${post.era} ${post.date}`.toLowerCase();

    return searchText.includes(q);
  });
}

/* =========================
   CLOUDINARY
========================= */

async function uploadToCloudinary(file) {

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);

  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
    method: 'POST',
    body: formData
  });

  const data = await res.json();
  return data.secure_url;
}

/* =========================
   ADMIN
========================= */

const adminModal = document.getElementById('adminModal');

function closeAdmin() {
  adminModal.classList.remove('active');
}

window.closeAdmin = closeAdmin;

document.getElementById('adminOpen').onclick = () => {
  adminModal.classList.add('active');
};

/* =========================
   RANDOM COUNTS
========================= */

function random(min,max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* =========================
   UPLOAD
========================= */

const uploadBtn = document.getElementById('uploadBtn');

uploadBtn.onclick = async () => {

  const platform = document.getElementById('platformSelect').value;
  const member = document.getElementById('memberSelect').value;
  const date = document.getElementById('dateInput').value;
  const era = document.getElementById('eraInput').value;
  const content = document.getElementById('contentInput').value;
  const files = [...document.getElementById('imageInput').files];
  const secret = document.getElementById('secretToggle').checked;
  const password = document.getElementById('secretPassword').value;

  if (platform === 'instagram' && files.length === 0) {
    alert('인스타그램 게시물은 이미지를 반드시 포함해야 합니다.');
    return;
  }

  if (platform === 'twitter' && files.length > 4) {
    alert('트위터는 최대 4장까지 가능합니다.');
    return;
  }

  if (platform === 'instagram' && files.length > 10) {
    alert('인스타그램은 최대 10장까지 가능합니다.');
    return;
  }

  const uploadedImages = [];

  for (const file of files) {
    const url = await uploadToCloudinary(file);
    uploadedImages.push(url);
  }

  const likes = platform === 'twitter'
    ? random(800,5000)
    : platform === 'weverse'
    ? random(300,3000)
    : random(1200,14000);

  const retweets = random(200, likes - 100);

  await addDoc(collection(db, 'posts'), {
    platform,
    member,
    date,
    era,
    content,
    images: uploadedImages,
    likes,
    retweets,
    secret,
    password,
    createdAt: Date.now()
  });

  closeAdmin();
  loadPosts();
};

/* =========================
   LIGHTBOX
========================= */

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');

function openLightbox(images,index){
  lightboxImages = images;
  lightboxIndex = index;
  lightbox.classList.add('active');
  updateLightbox();
}

function updateLightbox(){
  lightboxImage.src = lightboxImages[lightboxIndex];
}

function nextLightbox(){
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  updateLightbox();
}

function prevLightbox(){
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
}

lightbox.onclick = (e) => {
  if (e.target === lightbox) {
    lightbox.classList.remove('active');
  }
};

document.querySelector('.lightbox-next').onclick = nextLightbox;
document.querySelector('.lightbox-prev').onclick = prevLightbox;

/* =========================
   RENDER
========================= */

function renderTwitter(){

  const container = document.getElementById('twitter');

  container.innerHTML = filteredPosts('twitter').map(post => {

    const images = post.images || [];

    return `
      <article class="twitter-post">

        <img class="tw-avatar" src="https://i.imgur.com/wSTFkRM.jpeg">

        <div class="w-full">

          <div class="flex items-center gap-2">
            <div class="font-bold text-white">${post.member}</div>
            <div class="text-[#71767b] text-[14px]">@archive · ${post.date}</div>

            <div class="dots-btn">
              <i class="fa-solid fa-ellipsis"></i>

              <div class="menu">
                <button onclick="editPost('${post.id}')">수정</button>
                <button onclick="deletePost('${post.id}')">삭제</button>
              </div>
            </div>
          </div>

          <div class="text-white text-[15px] leading-[1.55] mt-1 whitespace-pre-wrap">
            ${post.content}
          </div>

          ${images.length > 0 ? `
            <div class="tw-grid grid-${Math.min(images.length,4)}">
              ${images.map((img,i)=>`
                <img onclick='openGallery(${JSON.stringify(images)},${i})' src="${img}">
              `).join('')}
            </div>
          ` : ''}

          <div class="tw-actions">
            <div><i class="fa-solid fa-retweet"></i> ${post.retweets.toLocaleString()}</div>
            <div><i class="fa-regular fa-heart"></i> ${post.likes.toLocaleString()}</div>
          </div>

        </div>
      </article>
    `;

  }).join('');

  bindMenus();
}

function renderWeverse(){

  const container = document.getElementById('weverseFeed');

  container.innerHTML = filteredPosts('weverse').map(post => {

    const hidden = post.secret;

    return `
      <div class="weverse-card">

        <div class="flex items-center gap-3">
          <img class="w-[48px] h-[48px] rounded-full object-cover" src="https://i.imgur.com/wSTFkRM.jpeg">

          <div>
            <div class="font-semibold text-[15px]">${post.member}</div>
            <div class="text-[#868686] text-[12px]">${post.date}</div>
          </div>

          <div class="dots-btn">
            <i class="fa-solid fa-ellipsis"></i>

            <div class="menu">
              <button onclick="editPost('${post.id}')">수정</button>
              <button onclick="deletePost('${post.id}')">삭제</button>
            </div>
          </div>
        </div>

        ${hidden ? `
          <div class="secret-overlay">
            <i class="fa-solid fa-lock text-[28px] mb-3"></i>
            <div>비밀포스트</div>
          </div>

          <button class="submit-btn" onclick="unlockPost('${post.password}','${post.id}')">비밀번호 입력</button>
        ` : `

          <div class="mt-4 leading-[1.7] whitespace-pre-wrap text-[15px]">
            ${post.content}
          </div>

          ${post.images?.length ? `
            <div class="weverse-gallery">
              ${post.images.slice(0,9).map((img,i)=>`
                <img onclick='openGallery(${JSON.stringify(post.images)},${i})' src="${img}">
              `).join('')}
            </div>
          ` : ''}

          <div class="flex items-center justify-between mt-5 text-[14px] text-[#a0a0a0]">
            <div><i class="fa-regular fa-heart"></i> ${post.likes.toLocaleString()}</div>
            <button>번역 보기</button>
          </div>
        `}

      </div>
    `;

  }).join('');

  bindMenus();
}

function renderInstagram(){

  const container = document.getElementById('instagramFeed');

  container.innerHTML = filteredPosts('instagram').map(post => {

    return `
      <article class="ig-post">

        <div class="flex items-center gap-3 px-4 py-3">
          <img class="w-[34px] h-[34px] rounded-full object-cover" src="https://i.imgur.com/wSTFkRM.jpeg">

          <div class="font-semibold text-[14px]">${post.member}</div>

          <div class="dots-btn">
            <i class="fa-solid fa-ellipsis"></i>

            <div class="menu">
              <button onclick="editPost('${post.id}')">수정</button>
              <button onclick="deletePost('${post.id}')">삭제</button>
            </div>
          </div>
        </div>

        <div class="ig-media">

          <img onclick='openGallery(${JSON.stringify(post.images)},0)' src="${post.images[0]}">

          ${post.images.length > 1 ? `
            <div class="carousel-badge">
              <i class="fa-regular fa-clone"></i>
            </div>
          ` : ''}

        </div>

        <div class="px-4 py-3">

          <div class="flex items-center justify-between text-[23px] mb-3">
            <div class="flex gap-4">
              <i class="fa-regular fa-heart"></i>
              <i class="fa-regular fa-comment"></i>
              <i class="fa-regular fa-paper-plane"></i>
            </div>

            <i class="fa-regular fa-bookmark"></i>
          </div>

          <div class="font-semibold text-[14px] mb-2">
            좋아요 ${post.likes.toLocaleString()}개
          </div>

          <div class="text-[14px] leading-[1.6]">
            <b>${post.member}</b>
            ${post.content}
          </div>

          <div class="text-[12px] text-[var(--sub)] mt-2">
            ${post.date}
          </div>

        </div>
      </article>
    `;

  }).join('');

  bindMenus();
}

function renderStories(){

  const container = document.getElementById('stories');

  container.innerHTML = MEMBERS.map(member => {

    return `
      <div class="story-item">
        <div class="story-ring">
          <img src="https://i.imgur.com/wSTFkRM.jpeg">
        </div>

        <div class="text-[12px] mt-2">${member}</div>
      </div>
    `;

  }).join('');
}

function renderAll(){
  renderTwitter();
  renderWeverse();
  renderInstagram();
  renderStories();
}

/* =========================
   MENUS
========================= */

function bindMenus(){

  document.querySelectorAll('.dots-btn').forEach(btn => {

    btn.onclick = (e) => {
      e.stopPropagation();

      const menu = btn.querySelector('.menu');

      document.querySelectorAll('.menu').forEach(m => {
        if (m !== menu) m.style.display = 'none';
      });

      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    };
  });
}

window.addEventListener('click',()=>{
  document.querySelectorAll('.menu').forEach(m=>m.style.display='none');
});

/* =========================
   EDIT / DELETE
========================= */

window.deletePost = async (id) => {

  if (!confirm('삭제하시겠습니까?')) return;

  await deleteDoc(doc(db,'posts',id));
  loadPosts();
};

window.editPost = (id) => {
  alert('편집 기능 영역입니다. 현재 구조에서 기존 데이터 불러와 수정창 연결하면 됩니다.');
};

window.unlockPost = (password,id) => {

  const input = prompt('비밀번호 입력');

  if (input === password) {

    const target = posts.find(v=>v.id===id);
    target.secret = false;
    renderWeverse();

  } else {
    alert('비밀번호가 올바르지 않습니다.');
  }
};

window.openGallery = (images,index) => {
  openLightbox(images,index);
};

/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const q = query(collection(db,'posts'), orderBy('createdAt','desc'));

  const snapshot = await getDocs(q);

  posts = snapshot.docs.map(docu => ({
    id: docu.id,
    ...docu.data()
  }));

  renderAll();
}

loadPosts();

</script>
